[project]
name = "codaio-exporter"
version = "0.4.0"
description = ""
authors = [{ name = "Sebastian Messmer", email = "mail@smessmer.de" }]
requires-python = ">=3.11,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.8.5,<4",
    "dataclasses-json>=0.6.0,<0.7",
    "rich>=13.5.2,<16",
    "aiofiles>=24.1.0,<26",
    "PyYAML>=6.0,<7",
]

[project.scripts]
codaio-exporter = "codaio_exporter.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pyright>=1.1.390,<2",
    "types-aiofiles>=25.1.0.20251011,<26",
    "types-PyYAML>=6.0.12.11,<7",
    "ruff>=0.16,<0.17",
]

[tool.pyright]
include = ["src/codaio_exporter", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
reportCallInDefaultInitializer = true
reportImplicitOverride = true
reportImplicitStringConcatenation = true
reportImportCycles = true
reportPropertyTypeMismatch = true
reportUninitializedInstanceVariable = true
reportMissingSuperCall = true
reportUnreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 150

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modernize syntax for py311+)
    "B",      # flake8-bugbear (common bug patterns)
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["codaio_exporter"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
